[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --alluredir=./allure-results
console_output_style = progress
norecursedirs = legacy .git __pycache__ allure-results allure-report

markers =
    smoke: 冒烟用例，提交前快速验证
    regression: 回归用例，覆盖完整业务链路
    api: 接口层用例
    ui: Playwright UI 用例（需要本机 Edge）
    auth: 鉴权相关
    product: 商品相关
    order: 订单相关
    contract: 契约 / 响应结构校验
    db: 落库一致性校验
    unit: 归因引擎等纯逻辑单测（不依赖 SUT）
