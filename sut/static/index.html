<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TestForge SUT · 商品管理</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #2f6fed;
    --danger: #d64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .hidden { display: none !important; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  .brand span { color: var(--primary); }
  .userbox { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .container { max-width: 1080px; margin: 28px auto; padding: 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  h2 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid rgba(47, 111, 237, .25); border-color: var(--primary); }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    background: var(--primary);
    color: #fff;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.danger { background: var(--danger); padding: 6px 12px; font-size: 13px; }
  .login-card { max-width: 380px; margin: 12vh auto 0; }
  .login-card button[type="submit"] { width: 100%; margin-top: 22px; }
  .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
  .hint {
    margin-top: 18px;
    padding: 10px 12px;
    background: #f8fafc;
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
  }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .toolbar input { flex: 1; }
  .create-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  .create-grid label { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef4ff; color: var(--primary); font-size: 12px; }
  .stock-out { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; }
  .toast {
    position: fixed; right: 24px; bottom: 24px;
    background: #1f2430; color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; transform: translateY(8px); transition: all .2s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .meta { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">TestForge <span>SUT</span></div>
  <div class="userbox hidden" id="userbox">
    <span>当前用户：<strong data-testid="current-user"></strong></span>
    <span class="badge" data-testid="current-role"></span>
    <button class="ghost" data-testid="logout" id="logout">退出登录</button>
  </div>
</header>

<!-- 登录视图 -->
<section class="container" id="login-view" data-testid="login-view">
  <div class="card login-card">
    <h2>登录</h2>
    <div class="sub">TestForge 内置被测系统 · 商品与订单管理</div>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" data-testid="username" autocomplete="username" placeholder="admin" />
      <label for="password">密码</label>
      <input id="password" data-testid="password" type="password" autocomplete="current-password" placeholder="admin123" />
      <div class="error" data-testid="login-error" id="login-error"></div>
      <button type="submit" data-testid="login-submit">登 录</button>
    </form>
    <div class="hint">演示账号：admin / admin123（管理员）　user / user123（普通用户）</div>
  </div>
</section>

<!-- 商品视图 -->
<section class="container hidden" id="products-view" data-testid="products-view">
  <div class="card" id="create-panel" data-testid="create-panel">
    <h2>新增商品</h2>
    <div class="sub">管理员可创建、删除商品（前端仅做展示，校验以接口为准）</div>
    <form id="create-form" class="create-grid">
      <div>
        <label for="create-name">商品名称</label>
        <input id="create-name" data-testid="create-name" placeholder="例如：机械键盘 K870" />
      </div>
      <div>
        <label for="create-price">价格（元）</label>
        <input id="create-price" data-testid="create-price" type="number" step="0.01" min="0.01" placeholder="399.00" />
      </div>
      <div>
        <label for="create-stock">库存</label>
        <input id="create-stock" data-testid="create-stock" type="number" min="0" placeholder="50" />
      </div>
      <div>
        <label for="create-category">分类</label>
        <select id="create-category" data-testid="create-category">
          <option value="数码">数码</option>
          <option value="配件">配件</option>
          <option value="办公">办公</option>
        </select>
      </div>
      <button type="submit" data-testid="create-submit">添加</button>
    </form>
    <div class="error" data-testid="create-error" id="create-error"></div>
  </div>

  <div class="card" style="margin-top: 18px;">
    <h2>商品列表</h2>
    <div class="sub">共 <span data-testid="product-total" id="product-total">0</span> 件商品</div>
    <div class="toolbar">
      <input data-testid="search-input" id="search-input" placeholder="按名称 / 描述搜索" />
      <button data-testid="search-submit" id="search-submit">搜索</button>
      <button class="ghost" id="reset-search" data-testid="reset-search">重置</button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width: 64px;">ID</th>
          <th>名称</th>
          <th style="width: 110px;">分类</th>
          <th style="width: 110px;">价格</th>
          <th style="width: 90px;">库存</th>
          <th style="width: 90px;">操作</th>
        </tr>
      </thead>
      <tbody id="product-body"></tbody>
    </table>
    <div class="empty hidden" data-testid="empty-state" id="empty-state">没有匹配的商品</div>
  </div>
</section>

<div class="toast" data-testid="toast" id="toast"></div>

<script>
  const API = "/api/v1";
  let token = localStorage.getItem("tf_token");

  const $ = (id) => document.getElementById(id);
  const loginView = $("login-view");
  const productsView = $("products-view");
  const userbox = $("userbox");

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function toast(message) {
    const el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2200);
  }

  async function api(path, options = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    if (token) headers.Authorization = "Bearer " + token;
    const response = await fetch(API + path, Object.assign({}, options, { headers }));
    const text = await response.text();
    const body = text ? JSON.parse(text) : null;
    return { status: response.status, body };
  }

  function showLogin() {
    loginView.classList.remove("hidden");
    productsView.classList.add("hidden");
    userbox.classList.add("hidden");
    history.replaceState({}, "", "/ui/login");
  }

  async function showProducts(user) {
    loginView.classList.add("hidden");
    productsView.classList.remove("hidden");
    userbox.classList.remove("hidden");
    document.querySelector("[data-testid='current-user']").textContent = user.username;
    document.querySelector("[data-testid='current-role']").textContent = user.role;
    $("create-panel").classList.toggle("hidden", user.role !== "admin");
    history.replaceState({}, "", "/ui/products");
    await loadProducts();
  }

  async function loadProducts(keyword = "") {
    const query = keyword ? "?keyword=" + encodeURIComponent(keyword) + "&size=50" : "?size=50";
    const { status, body } = await api("/products" + query);
    if (status !== 200) {
      toast("加载商品失败");
      return;
    }
    $("product-total").textContent = body.total;
    $("empty-state").classList.toggle("hidden", body.items.length > 0);
    const isAdmin = document.querySelector("[data-testid='current-role']").textContent === "admin";
    $("product-body").innerHTML = body.items.map((p) => `
      <tr data-testid="product-row" data-product-id="${p.id}">
        <td>${p.id}</td>
        <td data-testid="product-name">${escapeHtml(p.name)}</td>
        <td><span class="badge">${escapeHtml(p.category)}</span></td>
        <td>￥${p.price.toFixed(2)}</td>
        <td data-testid="product-stock-${p.id}" class="${p.stock === 0 ? "stock-out" : ""}">${p.stock}</td>
        <td>${isAdmin ? `<button class="danger" data-testid="delete-${p.id}" onclick="removeProduct(${p.id})">删除</button>` : "-"}</td>
      </tr>`).join("");
  }

  async function removeProduct(id) {
    const { status } = await api("/products/" + id, { method: "DELETE" });
    if (status === 204) {
      toast("已删除商品 #" + id);
      await loadProducts($("search-input").value.trim());
    } else {
      toast("删除失败（商品可能已被订单引用）");
    }
  }

  async function boot() {
    if (!token) { showLogin(); return; }
    const { status, body } = await api("/auth/me");
    if (status !== 200) {
      token = null;
      localStorage.removeItem("tf_token");
      showLogin();
      return;
    }
    await showProducts(body);
  }

  $("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("login-error").textContent = "";
    const username = $("username").value.trim();
    const password = $("password").value;
    const { status, body } = await api("/auth/login", {
      method: "POST",
      body: JSON.stringify({ username, password }),
    });
    if (status !== 200) {
      $("login-error").textContent = body && body.code === "INVALID_CREDENTIALS"
        ? "用户名或密码错误" : "登录失败，请稍后重试";
      return;
    }
    token = body.access_token;
    localStorage.setItem("tf_token", token);
    await showProducts(body.user);
  });

  $("logout").addEventListener("click", () => {
    token = null;
    localStorage.removeItem("tf_token");
    showLogin();
  });

  $("create-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("create-error").textContent = "";
    const name = $("create-name").value.trim();
    const price = parseFloat($("create-price").value);
    const stock = parseInt($("create-stock").value, 10);
    const category = $("create-category").value;
    if (!name || Number.isNaN(price) || Number.isNaN(stock)) {
      $("create-error").textContent = "请完整填写商品名称、价格和库存";
      return;
    }
    const { status, body } = await api("/products", {
      method: "POST",
      body: JSON.stringify({
        name,
        price_cents: Math.round(price * 100),
        stock,
        category,
        description: "由 UI 创建的商品",
      }),
    });
    if (status !== 201) {
      $("create-error").textContent = (body && body.message) || "创建失败";
      return;
    }
    toast("已添加商品：" + name);
    $("create-form").reset();
    await loadProducts($("search-input").value.trim());
  });

  $("search-submit").addEventListener("click", () => loadProducts($("search-input").value.trim()));
  $("reset-search").addEventListener("click", () => {
    $("search-input").value = "";
    loadProducts();
  });
  $("search-input").addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); loadProducts(event.target.value.trim()); }
  });

  window.removeProduct = removeProduct;
  boot();
</script>
</body>
</html>
